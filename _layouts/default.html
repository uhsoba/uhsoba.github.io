<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<link rel="icon" href="{{ "/assets/images/favicon.png" | relative_url }}">
<link rel="apple-touch-icon" href="{{ "/assets/images/favicon.png" | relative_url }}">
<link rel="apple-touch-startup-image" href="{{ "/assets/images/favicon.png" | relative_url }}">
<meta name="apple-mobile-web-app-title" content="{{site.name}}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="#e4d882">
<title>{{ page.title }} | {{site.title}} </title>
<meta name="theme-color" content="#e4d882">
{% seo %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.3.2/css/flag-icons.min.css" />
<link href="{{ "/assets/styles/theme.css" | relative_url }}" rel="stylesheet">
  
{{site.sharethis}}
</head>



{% capture layout %}{% if page.layout %}layout-{{ page.layout }}{% endif %}{% endcapture %}


<!-- Begin Menu Navigation
================================================== -->
{% include navbar.html %}
<!-- End Menu Navigation
================================================== -->

<body class="site-content d-flex flex-column min-vh-100">

    <div class="container">

    <!-- Site Title
    ================================================== -->

      <div class="mainheading" style="display:none;">
          <h1 class="sitetitle">{{ site.name }}</h1>
          <p class="lead">
              {{ site.description }}
          </p>
      </div>


    <!-- Content
    ================================================== -->
      <div class="main-content">
          {{ content }}
      </div>

    </div><!-- /.container -->

</body> <!-- /.site-content>

<!-- Begin Footer
    ================================================== -->

{% include footer.html %}

<!-- End Footer
    ================================================== -->
 

</html>
